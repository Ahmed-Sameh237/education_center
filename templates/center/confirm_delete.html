{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h3 class="fw-bold text-danger mb-3">⚠️ تأكيد الحذف</h3>
            <p class="fs-5 mb-4">هل أنت متأكد من رغبتك في حذف العنصر: <strong>"{{ object }}"</strong>؟</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="javascript:history.back()" class="btn btn-secondary px-4">إلغاء</a>
                    <button type="submit" class="btn btn-danger px-4">نعم، متأكد من الحذف</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
