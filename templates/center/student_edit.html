{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">{{ title }}</h2>
    <a href="{% url 'center:student_detail' student.id %}" class="btn btn-outline-secondary">← عودة لملف الطالب</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                
                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <a href="{% url 'center:student_delete' student.id %}" class="btn btn-outline-danger px-4">🗑️ حذف الطالب نهائياً</a>
                    <button type="submit" class="btn btn-primary px-5 py-2">💾 حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
