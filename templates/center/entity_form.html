{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">{{ title }}</h2>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">← عودة للصفحة السابقة</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                    <div class="form-text text-muted small">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-5 py-2">💾 حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
