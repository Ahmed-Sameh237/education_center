<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - إدارة المركز التعليمي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; padding: 35px; background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center fw-bold mb-2">📚 المركز التعليمي</h3>
        <p class="text-center text-muted mb-4 fs-6">تسجيل الدخول للنظام الإداري</p>
        
        {% if form.errors %}
        <div class="alert alert-danger py-2">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">اسم المستخدم:</label>
                <input type="text" name="username" class="form-control py-2" placeholder="أدخل اسم المستخدم" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">كلمة المرور:</label>
                <input type="password" name="password" class="form-control py-2" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-bold">دخول النظام</button>
        </form>
    </div>
</body>
</html>
