{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h3 class="fw-bold text-primary mb-3">✏️ تعديل بيانات المستخدم: {{ employee.username }}</h3>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">الاسم الكامل</label>
                <input type="text" name="full_name" class="form-control" value="{{ employee.first_name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور الجديدة (اتركها فارغة إذا لم ترد التغيير)</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة مرور جديدة إن أردت">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_staff" class="form-check-input" id="editStaff" {% if employee.is_staff %}checked{% endif %}>
                <label class="form-check-label fw-bold" for="editStaff">منح صلاحيات الإدارة (Staff)</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_superuser" class="form-check-input" id="editSuper" {% if employee.is_superuser %}checked{% endif %}>
                <label class="form-check-label fw-bold text-danger" for="editSuper">منح صلاحيات المالك الكاملة (Superuser)</label>
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'center:employee_list' %}" class="btn btn-secondary">إلغاء العودة</a>
                <button type="submit" class="btn btn-success">💾 حفظ التعديلات</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
